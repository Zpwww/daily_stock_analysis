name: 定时到期自停

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否到期
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          END="2026-11-18"
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "今天: ${TODAY} / 运行期截止: ${END}"
          echo ""
          if [[ "$TODAY" > "$END" ]]; then
            echo "运行期已结束，开始停用定时任务"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/00-daily-analysis.yml/disable" && echo " 已停用: 每日股票分析"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/zz-auto-stop.yml/disable" && echo " 已停用: 本工作流"
          else
            echo "仍在运行期内，每日分析继续"
          fi
